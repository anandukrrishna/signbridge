<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | SignBridge</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-1: #0b1020;
            --bg-2: #111a33;
            --bg-3: #182847;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-strong: rgba(255, 255, 255, 0.12);
            --border: rgba(255, 255, 255, 0.14);
            --text: #eef4ff;
            --muted: rgba(238, 244, 255, 0.68);
            --accent-1: #ff5f6d;
            --accent-2: #7c5cff;
            --accent-3: #00d4ff;
            --shadow: 0 20px 60px rgba(0, 0, 0, .35);
            --radius-xl: 28px;
            --radius-lg: 18px;
            --radius-md: 14px;
            --ring: 0 0 0 4px rgba(0, 212, 255, .12);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 20%, rgba(124, 92, 255, .22), transparent 22%),
                radial-gradient(circle at 85% 75%, rgba(255, 95, 109, .22), transparent 22%),
                radial-gradient(circle at 50% 10%, rgba(0, 212, 255, .14), transparent 20%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2) 45%, var(--bg-3));
            overflow-x: hidden;
        }

        .noise,
        .grid-overlay,
        .blob {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .grid-overlay {
            background-image:
                linear-gradient(rgba(255, 255, 255, .03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, .03) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: radial-gradient(circle at center, black 35%, transparent 90%);
            -webkit-mask-image: radial-gradient(circle at center, black 35%, transparent 90%);
            animation: fadeGrid 1.4s ease;
        }

        .blob::before,
        .blob::after {
            content: "";
            position: absolute;
            width: 28rem;
            height: 28rem;
            border-radius: 50%;
            filter: blur(110px);
            opacity: .34;
            animation: float 14s ease-in-out infinite;
            will-change: transform;
        }

        .blob::before {
            left: -6rem;
            top: -4rem;
            background: #7c5cff;
        }

        .blob::after {
            right: -7rem;
            bottom: -5rem;
            background: #ff5f6d;
            animation-delay: -6s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate3d(0, 0, 0);
            }
            50% {
                transform: translate3d(30px, 40px, 0);
            }
        }

        @keyframes fadeGrid {
            from {
                opacity: 0;
                transform: scale(1.02);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .auth-shell {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 16px;
            animation: shellFade 0.9s cubic-bezier(.22, 1, .36, 1);
        }

        @keyframes shellFade {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-card {
            width: min(100%, 470px);
            background: linear-gradient(180deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, .06));
            border: 1px solid var(--border);
            border-radius: 24px;
            backdrop-filter: blur(24px) saturate(140%);
            -webkit-backdrop-filter: blur(24px) saturate(140%);
            box-shadow: var(--shadow);
            padding: 20px 20px;
            position: relative;
            overflow: hidden;
            animation: reveal .85s cubic-bezier(.2, .8, .2, 1), cardFloat 7s ease-in-out infinite 1.2s;
            will-change: transform, opacity;
            transform: translateZ(0);
        }

        .auth-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, rgba(255, 255, 255, .14), transparent 35%, transparent 65%, rgba(255, 255, 255, .08));
            pointer-events: none;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(18px) scale(.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes cardFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-4px);
            }
        }

        /* ===== COMPACT BRAND ===== */
        .premium-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px 8px 10px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 10px 30px rgba(0, 0, 0, 0.18);
            transition: all 0.3s ease;
            margin-bottom: 14px;
            width: fit-content;
            animation: itemUp .7s cubic-bezier(.22, 1, .36, 1) both;
            animation-delay: .12s;
        }

        .premium-brand:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.11);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 16px 35px rgba(0, 0, 0, 0.24);
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            font-size: 1rem;
            color: white;
            background: linear-gradient(135deg, #ff6a88, #7c5cff);
            box-shadow:
                0 12px 24px rgba(124, 92, 255, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            transition: transform .3s ease;
        }

        .premium-brand:hover .brand-icon {
            transform: scale(1.04) rotate(-2deg);
        }

        .brand-icon::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, .18), transparent 45%, transparent);
            pointer-events: none;
        }

        .brand-text-wrap {
            display: flex;
            flex-direction: column;
            justify-content: center;
            line-height: 1.1;
        }

        .brand-name {
            font-size: 1.28rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #eef4ff;
        }

        .brand-tagline {
            margin-top: 1px;
            font-size: 0.70rem;
            font-weight: 500;
            color: rgba(238, 244, 255, 0.70);
            letter-spacing: 0.01em;
        }

        .title {
            font-size: clamp(1.8rem, 3vw, 2.2rem);
            font-weight: 800;
            line-height: 1.05;
            margin-bottom: 4px;
            letter-spacing: -.03em;
            animation: itemUp .7s cubic-bezier(.22, 1, .36, 1) both;
            animation-delay: .2s;
        }

        .subtitle {
            color: var(--muted);
            margin-bottom: 14px;
            font-size: .88rem;
            animation: itemUp .7s cubic-bezier(.22, 1, .36, 1) both;
            animation-delay: .28s;
        }

        .field-wrap {
            margin-bottom: 12px;
            animation: itemUp .75s cubic-bezier(.22, 1, .36, 1) both;
        }

        .field-wrap:nth-of-type(1) {
            animation-delay: .36s;
        }

        .field-wrap:nth-of-type(2) {
            animation-delay: .46s;
        }

        @keyframes itemUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .field-label {
            display: block;
            font-size: .72rem;
            letter-spacing: .11em;
            text-transform: uppercase;
            color: rgba(238, 244, 255, .76);
            margin: 0 0 6px 4px;
            font-weight: 700;
            transition: transform .25s ease, color .25s ease;
        }

        .input-shell {
            display: flex;
            align-items: center;
            min-height: 46px;
            border-radius: 14px;
            background: rgba(255, 255, 255, .07);
            border: 1px solid rgba(255, 255, 255, .10);
            transition: .25s ease;
            overflow: hidden;
            position: relative;
            will-change: transform, box-shadow, background;
            transform: translateZ(0);
        }

        .input-shell::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transform: translateX(-120%);
            transition: transform .7s ease;
            pointer-events: none;
        }

        .input-shell:hover {
            background: rgba(255, 255, 255, .09);
            transform: translateY(-1px);
        }

        .input-shell:hover::after {
            transform: translateX(120%);
        }

        .input-shell:focus-within {
            background: rgba(255, 255, 255, .12);
            border-color: rgba(0, 212, 255, .42);
            box-shadow: var(--ring), 0 10px 26px rgba(0, 0, 0, .18);
            transform: translateY(-1px) scale(1.005);
        }

        .input-shell:focus-within .input-icon,
        .input-shell:focus-within .toggle-btn {
            color: var(--accent-3);
            transform: scale(1.05);
        }

        .input-shell:focus-within + .field-label {
            color: var(--accent-3);
        }

        .input-icon,
        .toggle-btn {
            width: 44px;
            display: grid;
            place-items: center;
            color: rgba(255, 255, 255, .60);
            flex-shrink: 0;
            transition: color .25s ease, transform .25s ease;
        }

        .toggle-btn {
            cursor: pointer;
            border: none;
            background: transparent;
            transition: .2s ease;
        }

        .toggle-btn:hover {
            color: var(--accent-3);
            transform: scale(1.08);
        }

        .toggle-btn:active {
            transform: scale(0.94);
        }

        .form-control {
            background: transparent !important;
            border: none !important;
            color: var(--text) !important;
            font-size: .90rem;
            padding: 10px 4px 10px 0 !important;
            box-shadow: none !important;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .form-control:focus {
            transform: translateX(1px);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, .42);
            transition: opacity .25s ease, transform .25s ease;
        }

        .form-control:focus::placeholder {
            opacity: .65;
            transform: translateX(2px);
        }

        .btn-premium {
            width: 100%;
            min-height: 46px;
            border: none;
            border-radius: 14px;
            color: #fff;
            font-weight: 800;
            letter-spacing: .06em;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            box-shadow: 0 14px 28px rgba(124, 92, 255, .30), inset 0 1px 0 rgba(255, 255, 255, .18);
            transition: .28s ease;
            position: relative;
            overflow: hidden;
            font-size: .84rem;
            animation: itemUp .8s cubic-bezier(.22, 1, .36, 1) both;
            animation-delay: .56s;
            will-change: transform, box-shadow;
        }

        .btn-premium::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .16), transparent);
            transform: translateX(-120%);
            transition: .6s ease;
        }

        .btn-premium:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 18px 34px rgba(124, 92, 255, .38);
        }

        .btn-premium:hover::before {
            transform: translateX(120%);
        }

        .btn-premium:active {
            transform: translateY(0) scale(.985);
        }

        .auth-footer {
            text-align: center;
            margin-top: 10px;
            color: var(--muted);
            font-size: .86rem;
            animation: itemUp .8s cubic-bezier(.22, 1, .36, 1) both;
            animation-delay: .66s;
        }

        .auth-footer a {
            color: var(--accent-3);
            text-decoration: none;
            font-weight: 700;
            transition: color .25s ease, opacity .25s ease;
        }

        .auth-footer a:hover {
            color: #fff;
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 1000px transparent inset !important;
            -webkit-text-fill-color: #eef4ff !important;
            transition: background-color 9999s ease-in-out 0s;
            caret-color: #eef4ff;
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, .04);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, rgba(255, 255, 255, .18), rgba(255, 255, 255, .10));
            border-radius: 999px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }

        @media (max-width: 575.98px) {
            .auth-shell {
                padding: 12px;
            }

            .auth-card {
                width: 100%;
                padding: 18px 16px;
                border-radius: 20px;
            }

            .premium-brand {
                width: 100%;
                max-width: 100%;
                justify-content: flex-start;
                border-radius: 18px;
                margin-bottom: 12px;
            }

            .brand-name {
                font-size: 1.18rem;
            }

            .brand-tagline {
                font-size: 0.66rem;
            }

            .title {
                font-size: 1.65rem;
            }

            .subtitle {
                font-size: 0.82rem;
                margin-bottom: 12px;
            }

            .field-label {
                font-size: .68rem;
                margin-bottom: 5px;
            }

            .input-shell {
                min-height: 44px;
                border-radius: 13px;
            }

            .form-control {
                font-size: .88rem;
            }

            .btn-premium {
                min-height: 44px;
                border-radius: 13px;
                font-size: .82rem;
            }

            .auth-footer {
                font-size: 0.82rem;
                margin-top: 8px;
            }
        }

        @media (max-height: 800px) {
            .auth-shell {
                padding: 12px;
            }

            .auth-card {
                padding: 18px 18px;
            }

            .premium-brand {
                margin-bottom: 12px;
            }

            .title {
                font-size: 1.8rem;
            }

            .subtitle {
                margin-bottom: 12px;
            }

            .field-wrap {
                margin-bottom: 10px;
            }

            .input-shell,
            .btn-premium {
                min-height: 44px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>
    <div class="noise"></div>
    <div class="grid-overlay"></div>
    <div class="blob"></div>

    {% block body %}

    <main class="auth-shell">
        <div class="auth-card">

            <div class="brand-chip premium-brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-hands-asl-interpreting"></i>
                </div>
                <div class="brand-text-wrap">
                    <span class="brand-name">SignBridge</span>
                    <small class="brand-tagline">Accessible Communication</small>
                </div>
            </div>

            <h1 class="title">Welcome Back</h1>
            <p class="subtitle">Bridging communication through sign language.</p>

            <form method="post" id="loginForm">
                {% csrf_token %}

                <div class="field-wrap">
                    <label class="field-label">Username</label>
                    <div class="input-shell">
                        <span class="input-icon"><i class="fa-regular fa-user"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
                    </div>
                </div>

                <div class="field-wrap">
                    <label class="field-label">Password</label>
                    <div class="input-shell">
                        <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="passwordField" name="password" class="form-control" placeholder="Enter your password" required>
                        <button type="button" class="toggle-btn" onclick="togglePassword()" aria-label="Toggle password visibility">
                            <i class="fa-regular fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-premium mt-2">Login</button>

                <div class="auth-footer">
                    Don’t have an account? <a href="/Adduser">Create one</a>
                </div>
            </form>
        </div>
    </main>

    <script>
        function togglePassword() {
            const passwordField = document.getElementById('passwordField');
            const eyeIcon = document.getElementById('eyeIcon');
            const isPassword = passwordField.type === 'password';

            passwordField.type = isPassword ? 'text' : 'password';
            eyeIcon.classList.toggle('fa-eye', !isPassword);
            eyeIcon.classList.toggle('fa-eye-slash', isPassword);

            eyeIcon.style.transform = 'scale(0.86)';
            setTimeout(() => {
                eyeIcon.style.transform = 'scale(1)';
            }, 140);
        }

        // Smooth submit feel without changing backend logic
        document.getElementById('loginForm').addEventListener('submit', function () {
            const btn = this.querySelector('.btn-premium');
            btn.style.transform = 'scale(0.985)';
            btn.style.opacity = '0.92';
        });
    </script>

    {% endblock %}

</body>

</html>
